<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060f">
<title>Space School</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060f;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    position: fixed; inset: 0;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; touch-action: none; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }

  /* ---- menu screens (shared look with Flight School) ---- */
  .screen { position: absolute; inset: 0; display: none; z-index: 20; }
  .space-bg { background: radial-gradient(120% 120% at 50% 0%, #2a3570 0%, #141a3a 55%, #05060f 100%); }
  .center { align-items: center; justify-content: center; flex-direction: column; gap: 4vh; }
  .bigtitle { color: #fff; font-size: clamp(28px, 6vh, 60px); font-weight: 800; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .cardrow { display: flex; gap: 3vw; align-items: center; justify-content: center; }
  .cardrow.wrap { flex-wrap: wrap; max-width: 94vw; }
  .pilotcard { border: none; border-radius: 28px; width: 30vw; max-width: 300px; height: 40vh; max-height: 380px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vh;
    box-shadow: 0 12px 0 rgba(0,0,0,.3), 0 18px 30px rgba(0,0,0,.4); cursor: pointer; transition: transform .1s; }
  .pilotcard:active { transform: scale(.95) translateY(4px); }
  .picon { font-size: clamp(60px, 16vh, 150px); line-height: 1; }
  .pname { color: #fff; font-size: clamp(18px, 3.4vh, 34px); font-weight: 800; }
  .creaturecard, .destcard { border: 6px solid #fff; border-radius: 24px; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 10px 0 rgba(0,0,0,.3), 0 16px 28px rgba(0,0,0,.4); cursor: pointer; overflow: hidden; padding: 6px; transition: transform .1s; }
  .creaturecard:active, .destcard:active { transform: scale(.94) translateY(4px); }
  .destcard { width: 26vw; max-width: 300px; height: 32vh; max-height: 300px; }
  .cimg { width: 100%; height: 100%; object-fit: contain; pointer-events: none;
    flex: 1 1 auto; min-height: 0; }  /* shrink so pips + name always fit below */
  .pips { display: flex; gap: 6px; padding: 6px 0 2px; }
  .pip { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
  .destname { color: #233; font-weight: 800; font-size: clamp(14px, 2.4vh, 24px); padding: 4px; }

  /* ---- generic HUD ---- */
  .hud { position: absolute; inset: 0; z-index: 15; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  /* throttle lever (launch + landing) */
  .throttle { position: absolute; left: 6vw; bottom: 8vh; width: 74px; height: 44vh; max-height: 360px;
    border-radius: 40px; border: 5px solid rgba(255,255,255,.7); background: rgba(20,30,60,.5);
    overflow: hidden; touch-action: none; }
  .throttle.retro { left: auto; right: 6vw; border-color: rgba(255,180,80,.8); }
  .throttle-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: linear-gradient(0deg, #ff7a2a, #ffd24a); transition: none; }
  .throttle.retro .throttle-fill { background: linear-gradient(0deg, #ff3b30, #ffb01a); }
  .throttle-knob { position: absolute; left: -6px; right: -6px; bottom: 0; height: 44px; border-radius: 22px;
    background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.5); }
  .launchbtn { position: absolute; right: 8vw; bottom: 14vh; width: 24vh; height: 24vh; min-width: 130px; min-height: 130px;
    max-width: 210px; max-height: 210px; border-radius: 50%; border: 8px solid #fff; background: #ff3b30; color: #fff;
    font-size: 9vh; box-shadow: 0 10px 0 #b02017, 0 16px 26px rgba(0,0,0,.4); cursor: pointer;
    animation: throb 1.1s ease-in-out infinite; }
  .launchbtn:active { transform: translateY(5px); box-shadow: 0 4px 0 #b02017; }
  .launchbtn.gone { display: none; }
  @keyframes throb { 0%,100% { box-shadow: 0 10px 0 #b02017, 0 16px 26px rgba(0,0,0,.4); } 50% { box-shadow: 0 10px 0 #b02017, 0 0 0 14px rgba(255,59,48,.35), 0 16px 26px rgba(0,0,0,.4); } }

  .hint { position: absolute; font-size: 42px; opacity: .55; pointer-events: none; animation: bob 1.4s ease-in-out infinite; }
  .hint-launch { left: calc(6vw + 24px); bottom: 54vh; }
  .hint-retro { right: calc(6vw + 24px); bottom: 54vh; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  /* nudge buttons (landing) */
  .nudge { position: absolute; left: 6vw; bottom: 8vh; display: flex; gap: 14px; }
  .nudgebtn { width: 74px; height: 74px; border-radius: 18px; border: 4px solid rgba(255,255,255,.8);
    background: rgba(20,30,60,.5); color: #fff; font-size: 30px; }
  .nudgebtn:active { transform: scale(.9); background: #ffd23f; color: #223; }

  /* throttle cap glyph (retro lever) */
  .throttle-cap { position: absolute; top: -6vh; left: 50%; transform: translateX(-50%); font-size: 34px; pointer-events: none; }
  /* hover mark on the retro lever — the middle holds altitude (fine control) */
  .throttle-hover { position: absolute; left: -8px; right: -8px; bottom: 50%; height: 4px;
    background: #7fd858; border-radius: 2px; box-shadow: 0 0 8px rgba(127,216,88,.7); pointer-events: none; }

  /* --- lander: altitude gauge, steer-to-pad strip, steer buttons --- */
  .altgauge { position: absolute; left: 4vw; top: 12vh; width: 60px; height: 60vh; max-height: 480px;
    border-radius: 30px; border: 4px solid rgba(255,255,255,.5); background: rgba(10,16,34,.4);
    overflow: hidden; backdrop-filter: blur(3px); }
  .altgauge-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    background: linear-gradient(0deg, #7fd858, #b6f08a); transition: height .1s linear, background .2s; }
  .altgauge.ok .altgauge-fill { background: linear-gradient(0deg, #ffb01a, #ffd76a); }
  .altgauge.hot .altgauge-fill { background: linear-gradient(0deg, #e0392b, #ff7a5e); }
  .altgauge-mark { position: absolute; left: 50%; transform: translateX(-50%); font-size: 30px; transition: bottom .1s linear; }
  .altgauge-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: repeating-linear-gradient(90deg, #fff 0 8px, #333 8px 16px); }

  .landtarget { position: absolute; top: calc(4vh + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: min(66vw, 460px); height: 44px; border-radius: 22px; background: rgba(10,16,34,.45);
    border: 2px solid rgba(255,255,255,.3); }
  .landtarget.on { border-color: rgba(127,216,88,.9); box-shadow: 0 0 14px rgba(127,216,88,.5); }
  .landtarget-zone { position: absolute; left: 50%; top: 0; bottom: 0; width: 16%; transform: translateX(-50%);
    background: rgba(127,216,88,.22); border-left: 2px dashed rgba(127,216,88,.7); border-right: 2px dashed rgba(127,216,88,.7); }
  .landtarget-mark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; transition: left .1s linear; }

  .steer { position: absolute; left: 50%; transform: translateX(-50%); bottom: 6vh; display: flex; gap: 5vw; }
  .steerbtn { width: 88px; height: 88px; border-radius: 22px; border: 4px solid rgba(255,255,255,.85);
    background: rgba(20,30,60,.55); color: #fff; font-size: 38px; cursor: pointer; }
  .steerbtn:active, .steerbtn.on { transform: scale(.92); background: #ffd23f; color: #223; }

  /* launch attitude indicator — keep the marker in the green zone by tilting */
  .attind { position: absolute; top: calc(9vh + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: min(62vw, 440px); height: 46px; border-radius: 24px; background: rgba(10,16,34,.45);
    border: 2px solid rgba(255,255,255,.3); backdrop-filter: blur(3px); }
  .attind.ok { border-color: rgba(127,216,88,.9); box-shadow: 0 0 14px rgba(127,216,88,.5); }
  .attind-zone { position: absolute; left: 50%; top: 0; bottom: 0; width: 22%; transform: translateX(-50%);
    background: rgba(127,216,88,.2); border-left: 2px dashed rgba(127,216,88,.7); border-right: 2px dashed rgba(127,216,88,.7); }
  .attind-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
    border-bottom: 20px solid #ffb01a; transition: left .08s linear; }
  .attind-marker.ok { border-bottom-color: #7fd858; }

  /* launch tilt buttons (attitude control), bottom-right */
  .tilt { position: absolute; right: 6vw; bottom: 8vh; display: flex; gap: 14px; }
  .tiltbtn { width: 78px; height: 78px; border-radius: 18px; border: 4px solid rgba(255,255,255,.8);
    background: rgba(20,30,60,.5); color: #fff; font-size: 34px; cursor: pointer; }
  .tiltbtn:active, .tiltbtn.on { transform: scale(.9); background: #ffd23f; color: #223; }

  /* ---- space cockpit ---- */
  .cockpit-frame { position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 90px 30px rgba(0,0,10,.65); border-bottom: 0 solid transparent; }
  .cockpit-glow { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(120% 60% at 50% 100%, rgba(120,180,255,.22), transparent 70%); }
  /* Apollo-style console: metallic gray panel, gauges, DSKY, toggle switches */
  .dashboard { position: absolute; left: 0; right: 0; bottom: 0; height: 22vh; min-height: 130px;
    background: linear-gradient(0deg, #10131f 60%, #171b2c 100%); border-top: 4px solid #2b3350;
    border-radius: 40px 40px 0 0 / 30px 30px 0 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; box-shadow: 0 -8px 30px rgba(0,0,0,.5); }
  .dashboard.apollo { flex-direction: row; align-items: center; justify-content: space-around; gap: 2vw;
    padding: 0 4vw; height: 24vh; min-height: 150px; border-radius: 0;
    background: linear-gradient(0deg, #6d727b 0%, #9a9fa8 46%, #c2c7cf 100%);
    border-top: 5px solid #565b63;
    box-shadow: inset 0 4px 0 rgba(255,255,255,.45), inset 0 -3px 8px rgba(0,0,0,.35), 0 -8px 30px rgba(0,0,0,.5); }
  .gaugecluster, .rightcluster { display: flex; align-items: center; gap: 14px; }
  .rightcluster { flex-direction: column; gap: 8px; }
  .gauge { position: relative; width: 66px; height: 66px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #1a2130, #0a0e16);
    border: 5px solid #cdd2da; box-shadow: inset 0 0 10px rgba(0,0,0,.9), 0 2px 4px rgba(0,0,0,.5); }
  .gauge-face { position: absolute; inset: 8px; border-radius: 50%;
    background: conic-gradient(from -120deg, #2b6f3a 0deg, #2b6f3a 150deg, #7a5a1f 150deg, #7a3320 240deg, transparent 240deg); opacity: .55; }
  .gauge-needle { position: absolute; left: 50%; bottom: 50%; width: 3px; height: 25px; margin-left: -1.5px;
    background: #ff5a3a; border-radius: 2px; transform-origin: bottom center; transition: transform .12s ease-out; }
  .gauge-hub { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #e6e9ee; }
  .dsky { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 14px;
    background: #0a1410; border: 4px solid #565b63; border-radius: 8px; box-shadow: inset 0 0 12px rgba(0,0,0,.9); }
  .dsky-label { font-size: 10px; letter-spacing: 3px; color: #5cff8a; opacity: .55; font-weight: 700; }
  .dsky-num { font-family: 'Courier New', monospace; font-weight: 800; font-size: clamp(26px, 5.6vh, 44px);
    letter-spacing: 3px; color: #3bff6a; text-shadow: 0 0 8px rgba(59,255,106,.7); line-height: 1; opacity: .85; }
  .dsky-num.ok { color: #3bff6a; opacity: 1; }
  .dsky-num.hot { color: #ffb01a; text-shadow: 0 0 8px rgba(255,176,26,.75); opacity: 1; }
  .dsky-lamps { display: flex; gap: 8px; }
  .dsky-lamp { width: 32px; height: 11px; border-radius: 3px; background: #1a2230; box-shadow: inset 0 0 3px rgba(0,0,0,.8); }
  .dsky-lamp.dock.lit { background: #3bff6a; box-shadow: 0 0 10px #3bff6a; }
  .dsky-lamp.fast.lit { background: #ffb01a; box-shadow: 0 0 10px #ffb01a; }
  .bulbs { display: flex; gap: 10px; }
  .bulb { width: 15px; height: 15px; border-radius: 50%; background: #3a3f47; box-shadow: inset 0 -2px 0 rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.3); }
  .bulb.lit { background: #ffe066; box-shadow: 0 0 10px #ffe066; }
  .switches { display: flex; gap: 10px; }
  .switch { width: 50px; height: 50px; border-radius: 10px; border: 3px solid #565b63;
    background: linear-gradient(#3b4148, #23272e); color: #fff; font-size: 22px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.35); cursor: pointer; }
  .switch:active { transform: translateY(2px); }
  .switch.on { background: #ffd23f; color: #223; box-shadow: 0 0 0 4px rgba(255,210,63,.4); }
  .thrust { position: absolute; right: 5vw; bottom: 27vh; width: 20vh; height: 20vh; min-width: 120px; min-height: 120px;
    max-width: 190px; max-height: 190px; border-radius: 50%; border: 8px solid #fff; background: #2f7fe6; color: #fff;
    font-size: 7vh; box-shadow: 0 10px 0 #1c5bb0, 0 16px 26px rgba(0,0,0,.4); cursor: pointer; z-index: 16; }
  .thrust:active, .thrust.on { transform: translateY(5px) scale(.97); box-shadow: 0 4px 0 #1c5bb0, 0 0 0 10px rgba(47,127,230,.3); }
  .brake { position: absolute; left: 5vw; bottom: 27vh; width: 20vh; height: 20vh; min-width: 120px; min-height: 120px;
    max-width: 190px; max-height: 190px; border-radius: 50%; border: 8px solid #fff; background: #e0392b; color: #fff;
    font-size: 7vh; box-shadow: 0 10px 0 #a0231a, 0 16px 26px rgba(0,0,0,.4); cursor: pointer; z-index: 16; }
  .brake:active, .brake.on { transform: translateY(5px) scale(.97); box-shadow: 0 4px 0 #a0231a, 0 0 0 10px rgba(224,57,43,.3); }

  /* RCS translation pad (left): slide up/down/left/right */
  .rcs { position: absolute; left: 4vw; bottom: 26vh; width: 172px; height: 172px; z-index: 16; }
  .rcsbtn { position: absolute; width: 58px; height: 58px; border-radius: 15px; border: 3px solid rgba(255,255,255,.85);
    background: rgba(20,30,60,.55); color: #fff; font-size: 26px; cursor: pointer; }
  .rcsbtn.up { top: 0; left: 57px; } .rcsbtn.down { bottom: 0; left: 57px; }
  .rcsbtn.left { left: 0; top: 57px; } .rcsbtn.right { right: 0; top: 57px; }
  .rcsbtn:active, .rcsbtn.on { background: #ffd23f; color: #223; transform: scale(.93); }
  /* fore/aft control (right): push toward the goal, or retro to slow */
  .foreaft { position: absolute; right: 5vw; bottom: 25vh; display: flex; flex-direction: column; gap: 14px; z-index: 16; }
  .fabtn { width: 14vh; height: 14vh; min-width: 100px; min-height: 100px; max-width: 150px; max-height: 150px;
    border-radius: 50%; border: 7px solid #fff; color: #fff; font-size: 6vh; cursor: pointer; }
  .fabtn.fore { background: #2f7fe6; box-shadow: 0 8px 0 #1c5bb0, 0 12px 20px rgba(0,0,0,.4); }
  .fabtn.aft { background: #e0392b; box-shadow: 0 8px 0 #a0231a, 0 12px 20px rgba(0,0,0,.4); }
  .fabtn:active, .fabtn.on { transform: translateY(4px) scale(.97); }
  .fabtn.fore.on { box-shadow: 0 4px 0 #1c5bb0, 0 0 0 9px rgba(47,127,230,.3); }
  .fabtn.aft.on { box-shadow: 0 4px 0 #a0231a, 0 0 0 9px rgba(224,57,43,.3); }

  /* alignment reticle (docking): centre crosshair + a marker on the goal */
  .reticle { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: 118px; height: 118px; z-index: 17; pointer-events: none; }
  .reticle-ring { position: absolute; inset: 0; border: 3px dashed rgba(255,255,255,.5); border-radius: 50%; }
  .reticle-cross { position: absolute; left: 50%; top: 50%; background: rgba(255,255,255,.55); }
  .reticle-cross.h { width: 30px; height: 2px; transform: translate(-50%, -50%); }
  .reticle-cross.v { width: 2px; height: 30px; transform: translate(-50%, -50%); }
  .reticle.locked .reticle-ring { border-style: solid; border-color: #7fd858; box-shadow: 0 0 16px rgba(127,216,88,.6); }
  .reticle.locked .reticle-cross { background: #7fd858; }
  .reticle-tgt { position: absolute; width: 52px; height: 52px; border: 4px solid #fff; border-radius: 50%;
    z-index: 17; pointer-events: none; box-shadow: 0 0 10px rgba(0,0,0,.5); transition: border-color .15s; }
  .starcount { position: absolute; top: calc(2vh + env(safe-area-inset-top)); right: 4vw; color: #ffe066;
    font-size: clamp(20px, 4vh, 34px); font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  /* the star-chart: current constellation filling in, top-left */
  .starchart { position: absolute; top: calc(2vh + env(safe-area-inset-top)); left: 3vw;
    width: 92px; height: 92px; border-radius: 16px; background: rgba(10,16,34,.5);
    border: 2px solid rgba(255,255,255,.25); backdrop-filter: blur(3px); pointer-events: none; }

  .stick { position: absolute; width: 140px; height: 140px; border-radius: 50%; z-index: 16;
    border: 4px solid rgba(255,255,255,.5); background: rgba(255,255,255,.1); pointer-events: none; }
  .stick-knob { position: absolute; width: 70px; height: 70px; border-radius: 50%; left: 35px; top: 35px;
    background: rgba(255,255,255,.85); box-shadow: 0 4px 12px rgba(0,0,0,.4); }

  .chevron { position: absolute; width: 68px; height: 68px; display: none; align-items: center; justify-content: center;
    font-size: 56px; z-index: 17; pointer-events: none; filter: drop-shadow(0 0 6px rgba(0,0,0,.5)); }

  .banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 26vh; z-index: 30; pointer-events: none; }
  .banner.show { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(.2); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
  .sepbadge { position: absolute; top: 20vh; left: 50%; transform: translateX(-50%); font-size: 80px; transition: opacity .3s; pointer-events: none; }

  /* ---- mission patches: trophy wall + earned toast (3.3) ---- */
  .cornerbtn { position: absolute; top: calc(2vh + env(safe-area-inset-top)); right: 3vw;
    width: 66px; height: 66px; border-radius: 18px; border: 4px solid #fff;
    background: rgba(255,255,255,.14); color: #fff; font-size: 32px; cursor: pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,.3); }
  .cornerbtn:active { transform: scale(.92); }
  .patchgrid { display: flex; flex-wrap: wrap; gap: 2.4vh; justify-content: center; align-items: center; max-width: 82vw; }
  .patch { --ring: #ffd23f; width: 13.5vh; height: 13.5vh; max-width: 118px; max-height: 118px;
    border-radius: 26px; background: #fff; border: 6px solid var(--ring);
    display: flex; align-items: center; justify-content: center; font-size: 6.6vh; line-height: 1;
    box-shadow: 0 8px 0 rgba(0,0,0,.2), 0 14px 24px rgba(0,0,0,.3); }
  .patch.locked { filter: grayscale(1); opacity: .28; border-color: #fff; box-shadow: none; }
  .patchback { position: absolute; bottom: 5vh; left: 50%; transform: translateX(-50%);
    width: 96px; height: 96px; border-radius: 50%; border: 6px solid #fff; background: #ffd23f;
    color: #333; font-size: 46px; cursor: pointer; box-shadow: 0 8px 0 rgba(0,0,0,.3); }
  .patchback:active { transform: translateX(-50%) translateY(4px) scale(.96); box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .patchtoasts { position: absolute; top: calc(15vh + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%); display: flex; gap: 12px; z-index: 35; pointer-events: none; }
  .patchtoasts.out { opacity: 0; transition: opacity .5s ease; }
  .patchtoast { --ring: #ffd23f; width: 84px; height: 84px; border-radius: 22px; background: #fff;
    border: 5px solid var(--ring); display: flex; align-items: center; justify-content: center;
    font-size: 42px; box-shadow: 0 8px 20px rgba(0,0,0,.4);
    transform: scale(0) rotate(-18deg); transition: transform .4s cubic-bezier(.2,1.4,.4,1); }
  .patchtoast.show { transform: scale(1) rotate(0); }

  /* wordless goal card (🛰️ then 🪐) — flashes when a leg begins */
  .goalbanner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 30vh; pointer-events: none; z-index: 24; filter: drop-shadow(0 8px 24px rgba(0,0,0,.6)); }
  .goalbanner.show { animation: goalpop 2s ease-out; }
  @keyframes goalpop { 0% { transform: scale(.3); opacity: 0; } 18% { transform: scale(1.1); opacity: 1; }
    30% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: scale(.95); opacity: 0; } }

  /* countdown — enormous, dead centre, pops on every tick */
  .countnum { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 38vh; font-weight: 900; color: #fff; pointer-events: none; z-index: 25;
    text-shadow: 0 6px 0 rgba(0,0,0,.25), 0 0 60px rgba(255,210,63,.55); }
  .countnum.tick { animation: countpop .9s ease-out; }
  @keyframes countpop { 0% { transform: scale(1.6); opacity: 0; } 25% { transform: scale(1); opacity: 1; }
