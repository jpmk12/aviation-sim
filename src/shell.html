<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f7fe6">
<title>Flight School</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #cdeaff;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    position: fixed; inset: 0;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; touch-action: none; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }

  /* fade + flash overlays */
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
  .fade { position: absolute; inset: 0; background: #cdeaff; opacity: 0; z-index: 45;
    transition: opacity .4s ease; pointer-events: none; }

  /* ---- menu screens ---- */
  .screen { position: absolute; inset: 0; display: none; z-index: 20;
    background: radial-gradient(120% 120% at 50% 0%, #7fc0ff 0%, #4f8fe6 55%, #3f6fd0 100%); }
  .center { align-items: center; justify-content: center; flex-direction: column; gap: 4vh; }
  .bigtitle { color: #fff; font-size: clamp(28px, 6vh, 60px); font-weight: 800;
    text-shadow: 0 3px 0 rgba(0,0,0,.15); letter-spacing: .5px; }
  .cardrow { display: flex; gap: 3vw; align-items: center; justify-content: center; }
  .cardrow.wrap { flex-wrap: wrap; max-width: 92vw; }

  .pilotcard { border: none; border-radius: 28px; width: 30vw; max-width: 300px; height: 40vh; max-height: 380px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vh;
    box-shadow: 0 12px 0 rgba(0,0,0,.18), 0 18px 30px rgba(0,0,0,.25); cursor: pointer; transition: transform .1s; }
  .pilotcard:active { transform: scale(.95) translateY(4px); box-shadow: 0 6px 0 rgba(0,0,0,.18); }
  .picon { font-size: clamp(60px, 16vh, 150px); line-height: 1; }
  .pname { color: #fff; font-size: clamp(18px, 3.4vh, 34px); font-weight: 800; opacity: .95; }

  .creaturecard, .destcard { border: 6px solid #fff; border-radius: 24px; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 10px 0 rgba(0,0,0,.15), 0 16px 28px rgba(0,0,0,.22); cursor: pointer;
    overflow: hidden; transition: transform .1s; padding: 6px; }
  .creaturecard:active, .destcard:active { transform: scale(.94) translateY(4px); }
  .destcard { width: 26vw; max-width: 300px; height: 34vh; max-height: 320px; }
  .cimg { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .pips { display: flex; gap: 6px; padding: 6px 0 2px; }
  .pip { width: 14px; height: 14px; border-radius: 50%; display: inline-block; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
  .swatch { width: 60%; height: 10px; border-radius: 6px; margin-top: 4px; }
  .destname { color: #333; font-weight: 800; font-size: clamp(14px, 2.4vh, 24px); padding: 4px; }
  /* rescue mission card — a distinct, pulsing "go help!" option */
  .rescuecard { border-color: #ff5a4d; background: #fff3f1; align-items: center; justify-content: center;
    animation: rescuepulse 1.2s ease-in-out infinite; }
  .rescueicon { font-size: 78px; line-height: 1; }
  @keyframes rescuepulse { 0%,100% { box-shadow: 0 10px 0 rgba(0,0,0,.15), 0 16px 28px rgba(0,0,0,.22); }
    50% { box-shadow: 0 10px 0 rgba(0,0,0,.15), 0 0 0 9px rgba(255,90,77,.32), 0 16px 28px rgba(0,0,0,.22); } }

  /* ---- mission patches: trophy wall + earned toast (3.3) ---- */
  .cornerbtn { position: absolute; top: calc(2vh + env(safe-area-inset-top)); right: 3vw;
    width: 66px; height: 66px; border-radius: 18px; border: 4px solid #fff;
    background: rgba(255,255,255,.18); color: #fff; font-size: 32px; cursor: pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,.25); }
  .cornerbtn:active { transform: scale(.92); }
  .patchgrid { display: flex; flex-wrap: wrap; gap: 2.4vh; justify-content: center;
    align-items: center; max-width: 82vw; }
  .patch { --ring: #ffd23f; width: 13.5vh; height: 13.5vh; max-width: 118px; max-height: 118px;
    border-radius: 26px; background: #fff; border: 6px solid var(--ring);
    display: flex; align-items: center; justify-content: center; font-size: 6.6vh; line-height: 1;
    box-shadow: 0 8px 0 rgba(0,0,0,.15), 0 14px 24px rgba(0,0,0,.22); }
  .patch.locked { filter: grayscale(1); opacity: .3; border-color: #fff; box-shadow: none; }
  .patchback { position: absolute; bottom: 5vh; left: 50%; transform: translateX(-50%);
    width: 96px; height: 96px; border-radius: 50%; border: 6px solid #fff; background: #ffd23f;
    color: #333; font-size: 46px; cursor: pointer; box-shadow: 0 8px 0 rgba(0,0,0,.2); }
  .patchback:active { transform: translateX(-50%) translateY(4px) scale(.96); box-shadow: 0 4px 0 rgba(0,0,0,.2); }

  .patchtoasts { position: absolute; top: calc(15vh + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%); display: flex; gap: 12px; z-index: 35; pointer-events: none; }
  .patchtoasts.out { opacity: 0; transition: opacity .5s ease; }
  .patchtoast { --ring: #ffd23f; width: 84px; height: 84px; border-radius: 22px; background: #fff;
    border: 5px solid var(--ring); display: flex; align-items: center; justify-content: center;
    font-size: 42px; box-shadow: 0 8px 20px rgba(0,0,0,.3);
    transform: scale(0) rotate(-18deg); transition: transform .4s cubic-bezier(.2,1.4,.4,1); }
  .patchtoast.show { transform: scale(1) rotate(0); }

  /* ---- flight HUD ---- */
  .hud { position: absolute; inset: 0; z-index: 15; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  .drop { position: absolute; right: 5vw; bottom: 6vh; width: 26vh; height: 26vh;
    min-width: 130px; min-height: 130px; max-width: 220px; max-height: 220px;
    border-radius: 50%; border: 8px solid #fff; background: #ff3b30; color: #fff;
    font-size: clamp(20px, 4.2vh, 42px); font-weight: 900; letter-spacing: 1px;
    box-shadow: 0 10px 0 #b02017, 0 16px 26px rgba(0,0,0,.35); cursor: pointer; }
  .drop:active, .drop.pulse { transform: translateY(5px) scale(.96); box-shadow: 0 4px 0 #b02017; }
  .drop.ready { animation: dropready 1.6s ease-in-out infinite; }
  @keyframes dropready { 0%,100% { box-shadow: 0 10px 0 #b02017, 0 16px 26px rgba(0,0,0,.35); }
    50% { box-shadow: 0 10px 0 #b02017, 0 0 0 10px rgba(255,59,48,.25), 0 16px 26px rgba(0,0,0,.35); } }

  .toys { position: absolute; top: calc(2vh + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; }
  .toy { width: 58px; height: 58px; border-radius: 16px; border: 3px solid rgba(255,255,255,.85);
    background: rgba(20,40,70,.35); color: #fff; font-size: 26px; cursor: pointer; backdrop-filter: blur(4px); }
  .toy.on { background: #ffd23f; border-color: #fff; box-shadow: 0 0 0 4px rgba(255,210,63,.4); }
  .toy:active { transform: scale(.9); }

  /* manual throttle lever (v2 reward) — vertical slider on the right edge,
     above the DROP button. Green fill rises with power: more fill = more
     energy, a wordless cue. Only present when CONFIG.manualThrottle. */
  .throttle { position: absolute; right: calc(1.5vw + env(safe-area-inset-right)); top: 11vh;
    width: 66px; height: 46vh; max-height: 420px; border-radius: 34px;
    border: 4px solid rgba(255,255,255,.75); background: rgba(20,40,70,.32);
    z-index: 16; overflow: hidden; backdrop-filter: blur(3px); box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .throttle-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    background: linear-gradient(#8ff09a, #2fae4a); }
  .throttle-knob { position: absolute; left: 50%; transform: translateX(-50%); top: 0;
    width: 72px; height: 42px; border-radius: 16px; background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center;
    font-size: 24px; }

  .stick { position: absolute; width: 140px; height: 140px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.55); background: rgba(255,255,255,.12); z-index: 16; pointer-events: none; }
  .stick-knob { position: absolute; width: 70px; height: 70px; border-radius: 50%;
    background: rgba(255,255,255,.85); box-shadow: 0 4px 12px rgba(0,0,0,.3); left: 35px; top: 35px; }

  .chevron { position: absolute; width: 68px; height: 68px; display: none; align-items: center; justify-content: center;
    font-size: 56px; z-index: 17; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.4);
    filter: drop-shadow(0 0 3px rgba(0,0,0,.3)); }

  .stallhint { position: absolute; top: 12vh; left: 50%; transform: translateX(-50%);
    font-size: 60px; transition: opacity .3s; pointer-events: none; z-index: 17; }

  /* takeoff rotation cue: a big bouncing up-arrow over the stick side */
  .pullhint { position: absolute; left: 18vw; bottom: 30vh; font-size: 12vh;
    pointer-events: none; z-index: 17; animation: pullbob .7s ease-in-out infinite;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.3)); }
  @keyframes pullbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4vh); } }

  .banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 26vh; z-index: 30; pointer-events: none; }
  .banner.show { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(.2); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }

  /* ---- portrait warning ---- */
  .portrait { position: absolute; inset: 0; z-index: 60; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh; background: #223; color: #fff; }
  .roticon { font-size: 22vh; animation: rock 1.6s ease-in-out infinite; }
  @keyframes rock { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
  .portmsg { font-size: clamp(22px, 5vh, 44px); font-weight: 800; }
</style>
<div id="app">
  <div id="stage"></div>
  <div id="ui"></div>
  <div id="flash"></div>
</div>
